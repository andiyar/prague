name: Keep Supabase Alive

on:
  schedule:
    # Run daily at 9am UTC to prevent free-tier pausing
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via direct PostgreSQL connection
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Direct psql via Supabase session pooler (IPv4-compatible)
          psql "$DATABASE_URL" -c "SELECT COUNT(*) FROM trip_segments;"
          echo "Direct DB ping successful at $(date -u)"
