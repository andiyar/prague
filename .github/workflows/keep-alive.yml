name: Keep Supabase Alive

on:
  schedule:
    # Run daily at 9am UTC to prevent free-tier pausing
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase via direct PostgreSQL connection
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Resolve to IPv4 to avoid GitHub Actions IPv6 routing issues
          DB_HOST="db.dyxupzbyssvcxjppipnl.supabase.co"
          IPV4=$(getent ahostsv4 "$DB_HOST" | head -1 | awk '{print $1}')
          echo "Resolved $DB_HOST to $IPV4"
          # Replace hostname with IPv4 and require SSL
          DB_URL=$(echo "$DATABASE_URL" | sed "s|$DB_HOST|$IPV4|")"?sslmode=require"
          psql "$DB_URL" -c "SELECT COUNT(*) FROM trip_segments;"
          echo "Direct DB ping successful at $(date -u)"
